name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality, Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lint & Typecheck Tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8==7.1.1 ruff==0.8.0 mypy==1.13.0

      - name: Run Flake8 & Ruff Checks
        run: |
          flake8 --max-line-length=120 .
          ruff check src tests main.py

      - name: Run Mypy Typecheck
        run: mypy src main.py --ignore-missing-imports

  test:
    name: Automated Test Suite (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with Coverage Gate
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=80

  build-and-security:
    name: Docker Build & Security Scans
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/python

      - name: Build Hardened Docker Image
        run: docker build -t python-data-pipeline:ci .

      - name: Verify Container Health Check
        run: docker run --rm python-data-pipeline:ci python main.py --health

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: python-data-pipeline:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
